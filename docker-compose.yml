services:
  db:
    image: postgres:16-alpine
    container_name: astrahealth-db
    environment:
      POSTGRES_USER: astra
      POSTGRES_PASSWORD: astra
      POSTGRES_DB: astrahealth
    ports:
      - "5432:5432"
    volumes:
      - astrahealth_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astra -d astrahealth"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  astrahealth_pgdata:
